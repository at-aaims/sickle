shared:
  dims: 3
  dtype: sst-binary
  noseed: true
  input_vars: [u, v, w, r]
  output_vars: [p, pv]
  cluster_var: [p, pv]
  nx: 514
  ny: 512
  nz: 256
  gravity: z
  fileprefix: "SST-P1-galgal-H{hypercubes}-cubes{num_hypercubes}-X{method}-ns{num_samples}"

subsample:
  hypercubes: random
  num_hypercubes: 4
  method: maxent
  path: /opt/data/sickle/P1F4R32_nx512ny512nz256_6vars/
  num_samples: 100
  num_clusters: 5
  nxsl: 32
  nysl: 32
  nzsl: 32
  timesteps: [28.04, 28.24, 28.44, 28.64, 28.84, 29.04, 29.24, 29.44]

train:
  epochs: 10
  batch: 16
  target: p_full
  window: 1
  arch: MLP_transformer
  sequence: true
