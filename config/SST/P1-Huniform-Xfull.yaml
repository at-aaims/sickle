shared:
  dims: 3
  dtype: sst-binary
  noseed: true
  input_vars: [u, v, w, r]
  output_vars: [p, pv]
  cluster_var: [p, pv]
  nx: 514
  ny: 512
  nz: 256
  gravity: z
  plot: true
  fileprefix: "SST-P1-H{hypercubes}-cubes{num_hypercubes}-X{method}-ns{num_samples}-window{window}"

subsample:
  hypercubes: uniform
  num_hypercubes: 2048
  method: full
  path: /lustre/orion/world-shared/stf006/muraligm/CFD135/data_iso/max_ent/binary_data/P1F4R32_testing/raw_data/
  nxsl: 32
  nysl: 32
  nzsl: 32 

train:
  epochs: 10
  batch: 4
  target: p_full
  window: 1
  arch: CNN_transformer
  sequence: true
