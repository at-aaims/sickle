shared:
  dims: 3
  dtype: sst-binary
  noseed: true
  input_vars: [u, v, w, r]
  output_vars: [p, pv]
  cluster_var: [p, pv]
  nx: 514
  ny: 512
  nz: 256
  gravity: z
  plot: true
  fileprefix: "SST-P1-cubes{num_hypercubes}-{nx}x{ny}x{nz}-ns{num_samples}-window{window}"

subsample:
  hypercubes: maxent
  num_hypercubes: 16
  method: maxent  # or random
  path: /lustre/orion/world-shared/stf006/muraligm/CFD135/data_iso/max_ent/binary_data/P1F4R32_testing/raw_data/
  num_samples: 3277
  num_clusters: 20
  nxsl: 32
  nysl: 32
  nzsl: 32 

train:
  epochs: 100
  batch: 4
  patience: 100
  target: p_full
  window: 2
  arch: MLP_transformer
  sequence: true
