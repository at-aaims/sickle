shared:
  dims: 3
  dtype: sst-binary
  noseed: true
  input_vars: [u, v, w, r]
  output_vars: [p]
  cluster_var: [p, pv]
  nx: 514
  ny: 512
  nz: 256
  gravity: z
  fileprefix: "{nxsl}x{nysl}x{nzsl}-ns{num_samples}-window{window}"

subsample:
  hypercubes: maxent
  num_hypercubes: 32
  method: maxent # random or uips
  path: "~/data/P1F4R32_nx512ny512nz256_6vars/"
  num_samples: 5000
  num_clusters: 20
  nxsl: 32
  nysl: 32
  nzsl: 32 

train:
  epochs: 100
  batch: 4
  patience: 100
  target: p_full
  window: 1
  arch: MLP_transformer
  sequence: true
