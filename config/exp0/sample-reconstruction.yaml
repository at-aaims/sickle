shared:
  dims: 3
  dtype: sst-binary
  noseed: true
  input_vars: [u, v, w, r]
  output_vars: [p]
  cluster_var: pv
  nx: 514
  ny: 512
  nz: 256
  gravity: z
  plot: true

subsample:
  method: maxent # random or uips
  path: /lustre/orion/world-shared/stf006/muraligm/CFD135/data_iso/max_ent/binary_data/P1F4R32_testing/raw_data/
  num_samples: 3000
  num_clusters: 20
  nxsl: 512
  nysl: 512
  nzsl: 256

train:
  epochs: 100
  batch: 4
  patience: 100
  target: p_full
  window: 2
  arch: MLP_transformer
  sequence: true
