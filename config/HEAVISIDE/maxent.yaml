shared:
  dtype: heaviside
  noseed: true
  cluster_var: [eta]
  N: 4096
  A1: 0.8
  k1: 16.0
  r0: 0.75
  num_timesteps: 20
  # time evolution (set all to 0 for the static field)
  step_dt: 0.05
  wave_speed: 0.2
  hf_wave_speed: 0.5
  front_speed: 0.05
  amp_eps: 0.4
  amp_tau: 0.3
  field_seed: 0
  fileprefix: "HEAVISIDE-X{method}-ns{num_samples}-nc{num_clusters}"

subsample:
  hypercubes: uniform
  num_hypercubes: 1
  method: maxent
  path: ./data
  num_samples: 256
  num_clusters: 10

train:
  epochs: 50
  batch: 32
  target: eta
  window: 1
  arch: fcn_sst
